name: Security Scanning - Code, Secrets & Dependencies

on:
  schedule:
    - cron: '0 4 * * 1' # Runs every Monday at 04:00 UTC
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secrets & Credentials Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  dependency-audit:
    name: NPM Dependency Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high

  static-analysis:
    name: Source Code Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Static Syntax & Configuration Check
        run: |
          node --check src/*.js tests/*.test.js
          echo "All source files verified syntactically valid."
